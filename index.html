<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebHost Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#07090f;color:#e8edf5;font-size:14px;line-height:1.5;min-height:100vh}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#1e2d40;border-radius:4px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.fadeUp{animation:fadeUp .22s ease}
.spin{animation:spin 1s linear infinite;display:inline-block}
.pulse{animation:pulse 2s infinite}

/* Layout */
#root{min-height:100vh}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:224px;flex-shrink:0;background:#0c1120;border-right:1px solid #1a2540;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid #1a2540;background:#0c1120;position:sticky;top:0;z-index:50;gap:12px;flex-shrink:0}
.page-content{flex:1;overflow-y:auto;padding:20px}

/* Sidebar items */
.sb-logo{padding:15px 14px 12px;border-bottom:1px solid #1a2540}
.sb-logo-text{font-size:15px;font-weight:700;letter-spacing:-.02em}
.sb-logo-sub{font-size:10px;color:#3d4f6e;margin-top:2px;display:flex;align-items:center;gap:5px}
.sb-section{font-size:10px;color:#3d4f6e;padding:10px 12px 5px;letter-spacing:.08em;text-transform:uppercase}
.sb-divider{height:1px;background:#1a2540;margin:6px 8px}
.nav-btn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;border:none;background:transparent;color:#7b8db0;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;text-align:left;margin:1px 6px;width:calc(100% - 12px)}
.nav-btn:hover{background:#141c30;color:#e8edf5}
.nav-btn.active{background:#00c97e18;color:#00c97e}
.nav-btn .icon{width:18px;text-align:center;flex-shrink:0;font-size:14px}
.nav-btn .lbl{flex:1}
.nav-badge{background:#1a2540;color:#7b8db0;font-size:10px;padding:1px 6px;border-radius:100px}
.nav-live{background:#00c97e18;color:#00c97e;font-size:9px;padding:1px 6px;border-radius:100px}

/* Stat box in sidebar */
.sb-stats{margin:8px;background:#141c30;border:1px solid #1a2540;border-radius:10px;padding:11px}
.sb-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.sb-stat{background:#0c1120;border:1px solid #1a2540;border-radius:7px;padding:7px 9px}
.sb-stat-val{font-size:15px;font-weight:700}
.sb-stat-lbl{font-size:10px;color:#3d4f6e;margin-top:1px}

/* Plan bar */
.sb-plan{margin:8px;background:#141c30;border:1px solid #1a2540;border-radius:8px;padding:9px 11px}
.progress{height:3px;background:#1a2540;border-radius:100px;overflow:hidden;margin:6px 0 4px}
.progress-fill{height:100%;background:#00c97e;border-radius:100px;transition:width .5s}

/* User section */
.sb-user{margin:8px;background:#141c30;border:1px solid #1a2540;border-radius:8px;overflow:hidden}
.sb-user-info{padding:9px 10px;display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;flex-shrink:0}
.sb-user-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-email{font-size:10px;color:#3d4f6e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-signout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;background:transparent;color:#7b8db0;font-size:12px;cursor:pointer;transition:all .15s;border-top:1px solid #1a2540;text-align:left}
.sb-signout:hover{background:#1a2540;color:#e8edf5}

/* Inputs */
.input{background:#0d1422;border:1px solid #1a2540;border-radius:8px;color:#e8edf5;font-size:13px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15px}
.input:focus{border-color:#00c97e;box-shadow:0 0 0 3px #00c97e15}
.input::placeholder{color:#3d4f6e}
.input.err{border-color:#ef4444 !important;box-shadow:0 0 0 3px #ef444415 !important}
.input.mono{font-family:'SF Mono',Monaco,monospace}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-weight:500;font-size:13px;padding:8px 16px;transition:all .15s;white-space:nowrap;border:none;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-green{background:#00c97e;color:#000}.btn-green:not(:disabled):hover{background:#00e08a;box-shadow:0 4px 18px #00c97e30}
.btn-ghost{background:transparent;border:1px solid #1a2540;color:#7b8db0}.btn-ghost:not(:disabled):hover{border-color:#2a3550;color:#e8edf5;background:#141c30}
.btn-red{background:#ef444415;border:1px solid #ef444430;color:#ef4444}.btn-red:not(:disabled):hover{background:#ef444425}
.btn-sm{font-size:12px;padding:5px 12px;border-radius:6px}
.btn-icon{background:transparent;border:none;color:#7b8db0;padding:5px;border-radius:6px;display:flex;align-items:center;transition:all .15s}.btn-icon:hover{background:#141c30;color:#e8edf5}

/* Cards */
.card{background:#0f1626;border:1px solid #1a2540;border-radius:12px;padding:16px}
.card-sm{background:#0f1626;border:1px solid #1a2540;border-radius:10px;padding:12px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500}
.badge-green{background:#00c97e18;color:#00c97e;border:1px solid #00c97e30}
.badge-blue{background:#4f8ef715;color:#4f8ef7;border:1px solid #4f8ef725}
.badge-yellow{background:#f59e0b18;color:#f59e0b;border:1px solid #f59e0b30}
.badge-red{background:#ef444415;color:#ef4444;border:1px solid #ef444430}
.badge-gray{background:#1a2540;color:#7b8db0;border:1px solid #1a2540}

/* Status badge */
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}

/* Tabs */
.tab-bar{display:flex;border-bottom:1px solid #1a2540;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.tab-bar::-webkit-scrollbar{display:none}
.tab-item{padding:9px 15px;background:transparent;border:none;color:#7b8db0;font-size:13px;font-weight:500;cursor:pointer;position:relative;white-space:nowrap;transition:color .15s;flex-shrink:0}
.tab-item:hover{color:#e8edf5}
.tab-item.active{color:#e8edf5}
.tab-item.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#00c97e;border-radius:2px 2px 0 0}

/* Toggle switch */
.toggle{width:38px;height:20px;border-radius:100px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle-knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px #0006}

/* Dropzone */
.dropzone{border:1.5px dashed #1a2540;border-radius:10px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .18s}
.dropzone:hover,.dropzone.over{border-color:#00c97e;background:#00c97e08}

/* Toast container */
.toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{display:flex;align-items:center;gap:10px;background:#0f1626;border:1px solid #1a2540;border-radius:10px;padding:11px 16px;font-size:13px;max-width:340px;box-shadow:0 8px 30px #0009;animation:slideUp .2s ease}

/* Grid helpers */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* Stat cards */
.stat-card{background:#0f1626;border:1px solid #1a2540;border-radius:10px;padding:13px}
.stat-num{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.stat-lbl{font-size:10px;color:#7b8db0;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.stat-sub{font-size:11px;color:#3d4f6e}

/* Table */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{padding:8px 12px;text-align:left;color:#7b8db0;font-weight:500;border-bottom:1px solid #1a2540;white-space:nowrap}
.table td{padding:9px 12px;border-bottom:1px solid #1a254044;color:#e8edf5}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:#141c3040}

/* Site row */
.site-row{padding:12px 16px;border-bottom:1px solid #1a2540;transition:background .12s;cursor:pointer}
.site-row:last-child{border-bottom:none}
.site-row:hover{background:#141c3060}

/* Code editor */
.code-editor{background:#060910;border:1px solid #1a2540;border-radius:8px;padding:13px;font-family:'SF Mono',Monaco,monospace;font-size:12px;color:#9cca9c;width:100%;resize:vertical;outline:none;line-height:1.8;min-height:300px}
.code-editor:focus{border-color:#00c97e44}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px;text-align:center;gap:12px}
.empty-icon{font-size:32px;margin-bottom:4px}
.empty-title{font-size:15px;font-weight:600}
.empty-desc{font-size:13px;color:#7b8db0;max-width:300px;line-height:1.6}

/* Shimmer skeleton */
.skel{background:#141c30;border-radius:6px;position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff08,transparent);animation:shimmer 1.5s infinite}

/* Modals */
.modal-bg{position:fixed;inset:0;background:#00000080;backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#0f1626;border:1px solid #1a2540;border-radius:14px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 24px 80px #000b;animation:fadeUp .2s ease}
.modal-header{padding:15px 20px;border-bottom:1px solid #1a2540;display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:20px}

/* Sync bar */
.sync-bar{background:#0f1626;border-bottom:1px solid #1a2540;padding:5px 20px;font-size:11px;color:#7b8db0;display:flex;align-items:center;gap:7px;flex-shrink:0}

/* Mobile overlay */
.mob-overlay{display:none;position:fixed;inset:0;background:#0008;z-index:150}
@media(max-width:768px){
  .sidebar{position:fixed;left:-224px;top:0;height:100vh;z-index:160;transition:left .25s ease}
  .sidebar.open{left:0;box-shadow:20px 0 50px #000b}
  .mob-overlay.show{display:block}
  .mob-menu-btn{display:flex !important}
  .page-content{padding:14px !important}
  .grid-2,.grid-4{grid-template-columns:1fr !important}
  .hide-mob{display:none !important}
}
@media(min-width:769px){.mob-menu-btn{display:none !important}}

/* Google auth styles */
.g-modal{position:fixed;inset:0;background:#00000077;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .18s ease}
.g-card{background:#fff;border-radius:8px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.2);overflow:hidden;animation:fadeUp .2s ease}
.g-title{font-size:22px;font-weight:400;color:#202124;margin-bottom:8px}
.g-sub{font-size:14px;color:#5f6368;margin-bottom:22px}
.g-input{width:100%;padding:12px 14px;border:1px solid #dadce0;border-radius:4px;font-size:14px;outline:none;color:#3c4043;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.g-input:focus{border-color:#1a73e8;box-shadow:0 0 0 2px #1a73e820}
.g-input.err{border-color:#d93025 !important}
.g-btn-next{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s}
.g-btn-next:hover{background:#1557b0}
.g-btn-next:disabled{opacity:.5;cursor:not-allowed}
.g-link{background:none;border:none;color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.g-link:hover{text-decoration:underline}
.g-acc-row{display:flex;align-items:center;gap:12px;padding:11px 36px;cursor:pointer;transition:background .12s;border-bottom:1px solid #f1f3f4}
.g-acc-row:last-child{border-bottom:none}
.g-acc-row:hover{background:#f8f9fa}
.g-avt{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.g-footer{background:#f8f9fa;border-top:1px solid #e8eaed;padding:10px 36px;display:flex;gap:18px}
.g-footer a{font-size:12px;color:#5f6368;cursor:pointer}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .4s}

/* Domain card */
.domain-card{background:#0f1626;border:1px solid #1a2540;border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:11px;transition:border-color .15s}
.domain-card.available{border-color:#00c97e22}
.domain-card.best{border-color:#00c97e55;background:#00c97e08}

/* Chat */
.chat-msg{padding:9px 13px;border-radius:12px;font-size:13px;max-width:82%;line-height:1.6;margin-bottom:8px}
.chat-user{background:#00c97e18;border:1px solid #00c97e22;color:#e8edf5;border-radius:12px 12px 2px 12px;align-self:flex-end}
.chat-ai{background:#141c30;border:1px solid #1a2540;color:#7b8db0;border-radius:12px 12px 12px 2px;align-self:flex-start}

/* Deploy timeline */
.deploy-step{display:flex;align-items:flex-start;gap:13px;padding:9px 0}
.deploy-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.deploy-line{width:1px;height:22px;margin:3px 0 0 12px;background:#1a2540}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const S = {
  user: null,
  sites: [],
  page: 'dash',
  siteId: null,
  siteTab: 'overview',
  sideOpen: false,
  syncing: false,
  chatMsgs: [{role:'a',text:"Hi! I'm the WebHost Pro assistant. How can I help?"}],
  deployFiles: [],
  domainTab: 'search',
  domainResults: null,
  connectDomain: '',
  connectSiteId: '',
  connectStep: 1,
  prevMode: 0,
  editContent: ''
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,9);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const fmtSz = b => b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(2)+'MB';
const fmtD = d => new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const emailKey = e => btoa(e.toLowerCase().trim()).replace(/[^a-zA-Z0-9]/g,'').slice(0,22);
const initials = n => n?n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2):'?';

// ─── CLOUD STORAGE ────────────────────────────────────────────────────────────
async function cGet(k){try{const r=await window.storage.get(k,true);return r?.value?JSON.parse(r.value):null}catch{return null}}
async function cSet(k,v){try{await window.storage.set(k,JSON.stringify(v),true)}catch{}}

// ─── LOCAL SESSION ────────────────────────────────────────────────────────────
const SK='whp_sess';const AK='whp_accs';
function getSession(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):null}catch{return null}}
function setSession(u){try{localStorage.setItem(SK,JSON.stringify(u))}catch{}}
function clearSession(){try{localStorage.removeItem(SK)}catch{}}
function getSaved(){try{const s=localStorage.getItem(AK);return s?JSON.parse(s):[]}catch{return[]}}
function saveAcc(u){try{const a=getSaved().filter(x=>x.email!==u.email);localStorage.setItem(AK,JSON.stringify([u,...a].slice(0,5)))}catch{}}
function removeAcc(e){try{localStorage.setItem(AK,JSON.stringify(getSaved().filter(x=>x.email!==e)))}catch{}}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg, type='success'){
  const colors={success:'#00c97e',error:'#ef4444',warn:'#f59e0b',info:'#4f8ef7'};
  const icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ'};
  const c=colors[type]||colors.success;
  const d=document.createElement('div');
  d.className='toast';
  d.style.borderLeft=`3px solid ${c}`;
  d.innerHTML=`<span style="color:${c};font-weight:700;font-size:15px">${icons[type]||'✓'}</span><span style="flex:1;color:#e8edf5">${msg}</span><span onclick="this.parentNode.remove()" style="color:#3d4f6e;cursor:pointer;font-size:16px;margin-left:4px">×</span>`;
  document.getElementById('toasts').appendChild(d);
  setTimeout(()=>d.remove&&d.remove(),4200);
}

// ─── RENDER SYSTEM ────────────────────────────────────────────────────────────
function render(){
  if(!S.user){renderAuth();return}
  renderApp();
}

function renderAuth(){
  document.getElementById('root').innerHTML = `
  <div style="min-height:100vh;background:#07090f;display:flex;flex-direction:column">
    <nav style="display:flex;align-items:center;justify-content:space-between;padding:15px 28px;border-bottom:1px solid #1a2540">
      <div style="display:flex;align-items:center;gap:9px">
        <div style="width:28px;height:28px;border-radius:8px;background:#00c97e18;border:1px solid #00c97e30;display:flex;align-items:center;justify-content:center;font-size:15px">⬡</div>
        <span style="font-size:15px;font-weight:700;letter-spacing:-.02em">WebHost<span style="color:#00c97e">.pro</span></span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="showAuthModal()">
        <span style="font-size:14px">G</span> Sign in
      </button>
    </nav>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center">
      <div style="display:inline-flex;align-items:center;gap:7px;background:#00c97e15;border:1px solid #00c97e30;border-radius:100px;padding:5px 14px;font-size:12px;color:#00c97e;font-weight:500;margin-bottom:24px">
        <span class="pulse dot" style="background:#00c97e"></span> Free static hosting platform
      </div>
      <h1 style="font-size:clamp(1.8rem,4.5vw,3.4rem);font-weight:700;line-height:1.1;letter-spacing:-.03em;margin-bottom:16px;max-width:600px">
        Deploy websites<br><span style="background:linear-gradient(135deg,#00c97e,#4f8ef7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">in 30 seconds</span>
      </h1>
      <p style="font-size:15px;color:#7b8db0;max-width:420px;line-height:1.7;margin-bottom:32px">Upload HTML, choose a subdomain, go live instantly. Your data syncs across all devices automatically.</p>

      ${savedAccountsHTML()}

      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px">
        ${['☁ Cloud Sync','🔒 Free SSL','🌐 Custom Domains','⚡ Instant Deploy','↺ Rollback','📊 Analytics','✏ Code Editor','🌍 .com Domains'].map(f=>`<div style="background:#0f1626;border:1px solid #1a2540;border-radius:100px;padding:6px 13px;font-size:12px;color:#7b8db0">${f}</div>`).join('')}
      </div>
    </div>
    <div style="text-align:center;padding:14px;border-top:1px solid #1a2540;font-size:12px;color:#3d4f6e">
      Data stored securely in the cloud · Syncs across all devices
    </div>
  </div>`;
}

function savedAccountsHTML(){
  const accs=getSaved();
  if(!accs.length) return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <button onclick="showAuthModal()" style="display:flex;align-items:center;justify-content:center;gap:11px;background:#fff;border:1px solid #dadce0;border-radius:8px;font-size:15px;font-weight:500;color:#3c4043;cursor:pointer;padding:12px 26px;width:100%;max-width:300px;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:all .15s" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.15)'" onmouseout="this.style.boxShadow='0 1px 2px rgba(0,0,0,.08)'">

// ─── AUTH MODAL ───────────────────────────────────────────────────────────────
let authStep='';let authEmail='';

function showAuthModal(){
  const saved=getSaved();

  let m=document.getElementById('auth-modal');
  if(!m){
    m=document.createElement('div');m.id='auth-modal';m.className='g-modal';
    document.body.appendChild(m);
  }
  m.style.display='flex';
  updateAuthModal();
}

function closeAuthModal(){
  const m=document.getElementById('auth-modal');
  if(m)m.style.display='none';
}

function updateAuthModal(){

            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:500;color:#202124;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</div>
              <div style="font-size:12px;color:#5f6368;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.email)}</div>

          <div class="g-avt" style="background:#f1f3f4;border:1px solid #e8eaed"><span style="color:#5f6368;font-size:18px">+</span></div>
          <div style="font-size:14px;color:#202124">Use another account</div>
        </div>
      </div>
      <div class="g-footer"><a>Help</a><a>Privacy</a><a>Terms</a></div>`;

  else if(authStep==='email'){
    body=`
      <div style="padding:26px 34px 0;text-align:center">
        <svg width="65" height="22" viewBox="0 0 65 22"><text y="18" font-family="Arial,sans-serif" font-size="20"><tspan fill="#4285f4">G</tspan><tspan fill="#ea4335">o</tspan><tspan fill="#fbbc05">o</tspan><tspan fill="#4285f4">g</tspan><tspan fill="#34a853">l</tspan><tspan fill="#ea4335">e</tspan></text></svg>
        <div class="g-title" style="margin-top:13px">Sign in</div>
        <div class="g-sub">to continue to WebHost Pro</div>
      </div>
      <div style="padding:0 34px 26px">
        <input class="g-input" id="g-email" type="email" placeholder="Email address" autofocus>
        <div id="g-email-err" style="font-size:12px;color:#d93025;margin-top:5px;display:none"></div>
        <div style="font-size:12px;color:#5f6368;margin-top:11px;line-height:1.6">Not your computer? Sign in privately.</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px">
          ${saved.length?`<button class="g-link" onclick="authStep='accounts';updateAuthModal()">← Back</button>`:'<a class="g-link" onclick="">Create account</a>'}

        </div>
      </div>
      <div class="g-footer"><a>Help</a><a>Privacy</a><a>Terms</a></div>`;
  }
  else if(authStep==='name'){
    body=`
      <div style="padding:26px 34px 0;text-align:center">
        <svg width="65" height="22" viewBox="0 0 65 22"><text y="18" font-family="Arial,sans-serif" font-size="20"><tspan fill="#4285f4">G</tspan><tspan fill="#ea4335">o</tspan><tspan fill="#fbbc05">o</tspan><tspan fill="#4285f4">g</tspan><tspan fill="#34a853">l</tspan><tspan fill="#ea4335">e</tspan></text></svg>

      <div style="padding:0 34px 26px">
        <input class="g-input" id="g-name" type="text" placeholder="Your full name" autofocus>
        <div style="font-size:11px;color:#5f6368;margin-top:7px">This is how you'll appear on WebHost Pro</div>

  }
  else if(authStep==='loading'){
    body=`

  }

  m.innerHTML=`
    <div class="g-card" onclick="event.stopPropagation()">
      ${body}
    </div>`;
  m.onclick=e=>{if(e.target===m)closeAuthModal()};

  // Focus inputs after render
  setTimeout(()=>{
    const gi=document.getElementById('g-email')||document.getElementById('g-name');
    if(gi)gi.focus();
    // Add enter key listeners
    const ge=document.getElementById('g-email');
    if(ge)ge.onkeydown=e=>{if(e.key==='Enter')gEmailNext()};
    const gn=document.getElementById('g-name');
    if(gn)gn.onkeydown=e=>{if(e.key==='Enter')gNameNext()};
  },50);

async function gEmailNext(){
  const em=(document.getElementById('g-email')?.value||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){
    const err=document.getElementById('g-email-err');
    if(err){err.textContent='Enter a valid email address';err.style.display='block'}
    document.getElementById('g-email')?.classList.add('err');
    return;
  }
  authEmail=em;
  authStep='loading';
  updateAuthModal();
  const existing=await cGet('whp:user:'+emailKey(em));
  if(existing){
    await sleep(800);
    await doLogin({email:em,name:existing.name,avatar:existing.avatar,createdAt:existing.createdAt});
  } else {
    authStep='name';
    updateAuthModal();
  }
}

async function gNameNext(){
  const nm=(document.getElementById('g-name')?.value||'').trim();
  if(!nm)return;
  authStep='loading';
  updateAuthModal();
  const colors=['#00c97e','#4f8ef7','#a855f7','#f59e0b','#ef4444','#06b6d4'];
  const avatar=colors[authEmail.charCodeAt(0)%colors.length];
  const profile={email:authEmail,name:nm,avatar,createdAt:Date.now()};
  await cSet('whp:user:'+emailKey(authEmail),profile);
  await sleep(800);
  await doLogin(profile);
}

async function loginSaved(email){
  authStep='loading';
  updateAuthModal();
  const existing=await cGet('whp:user:'+emailKey(email));
  if(existing){
    await sleep(600);
    await doLogin({email,name:existing.name,avatar:existing.avatar,createdAt:existing.createdAt});
  } else {
    removeAcc(email);
    authStep='email';
    updateAuthModal();
    toast('Account not found. Please sign in again.','warn');
  }
}

async function quickLogin(email){
  document.getElementById('root').innerHTML=`
    <div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px">
      <div class="spin" style="font-size:28px;color:#00c97e">◌</div>
      <div style="font-size:13px;color:#7b8db0">Signing in...</div>
    </div>`;
  const saved=getSaved().find(a=>a.email===email);
  if(saved) await doLogin(saved);
  else showAuthModal();
}

async function doLogin(user){
  S.user=user;
  setSession(user);
  saveAcc(user);
  closeAuthModal();
  // Load sites
  const data=await cGet('whp:sites:'+emailKey(user.email));
  S.sites=data||[];
  toast(`Welcome back, ${user.name.split(' ')[0]}! 👋`);
  render();
}

function logout(){
  clearSession();
  S.user=null;S.sites=[];S.siteId=null;S.page='dash';
  render();
}

function getPageTitle(){
  if(S.page==='site'){const s=S.sites.find(x=>x.id===S.siteId);return s?s.sub+'.webhost.pro':'Site'}
  const titles={dash:'Dashboard',sites:'My Sites',new:'New Deployment',domains:'Domain Manager',support:'AI Support',docs:'Documentation'};
  return titles[S.page]||S.page;
}

function goPage(p){
  S.page=p;S.siteId=null;
  closeSidebar();
  const t=document.getElementById('topbar-title');
  if(t)t.textContent=getPageTitle();
  const nav=document.querySelectorAll('.nav-btn');
  nav.forEach(b=>{
    b.classList.remove('active');
    const onclick=b.getAttribute('onclick')||'';
    if(onclick.includes(`'${p}'`)||((p==='sites'||p==='site')&&onclick.includes("'sites'"))) b.classList.add('active');
  });
  renderPage();
}

function renderPage(){
  const el=document.getElementById('page-body');
  if(!el)return;
  el.className='page-content fadeUp';
  void el.offsetWidth;
  if(S.page==='dash')el.innerHTML=renderDash();
  else if(S.page==='sites')el.innerHTML=renderSites();
  else if(S.page==='new')el.innerHTML=renderNew();
  else if(S.page==='domains')el.innerHTML=renderDomains();
  else if(S.page==='support')el.innerHTML=renderSupport();
  else if(S.page==='docs')el.innerHTML=renderDocs();
  else if(S.page==='site')el.innerHTML=renderSiteManager();
}

function openSite(id){
  S.siteId=id;S.page='site';S.siteTab='overview';
  closeSidebar();
  const t=document.getElementById('topbar-title');
  const s=S.sites.find(x=>x.id===id);
  if(t&&s)t.textContent=s.sub+'.webhost.pro';
  renderPage();
}

function sbadge(status){
  const m={live:['badge-green','Live'],paused:['badge-yellow','Paused'],building:['badge-blue','Building'],error:['badge-red','Failed']};

  return `<span class="badge ${cls}">${dot}${lbl}</span>`;
}
function empty(icon,title,desc,action,lbl){

}

function checkSub(){
  const v=(document.getElementById('n-sub')?.value||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  if(document.getElementById('n-sub'))document.getElementById('n-sub').value=v;
  const msg=document.getElementById('sub-msg');if(!msg)return;
  if(!v){msg.style.display='none';return;}
  if(v.length<3){msg.innerHTML='<span style="color:#ef4444">⚠ Minimum 3 characters</span>';msg.style.display='block';return;}
  if(S.sites.find(s=>s.sub===v)){msg.innerHTML='<span style="color:#ef4444">⚠ Subdomain already taken</span>';msg.style.display='block';return;}
  msg.innerHTML=`<div style="display:flex;align-items:center;gap:8px;padding:7px 11px;background:#00c97e12;border:1px solid #00c97e30;border-radius:8px"><span class="pulse dot" style="background:#00c97e"></span><span style="font-family:monospace;font-size:12px;color:#00c97e">https://${v}.webhost.pro</span><span class="badge badge-green" style="margin-left:auto;font-size:10px">Available</span></div>`;
  msg.style.display='block';
}

function handleDrop(e){e.preventDefault();document.getElementById('dropzone')?.classList.remove('over');handleFiles(e.dataTransfer.files);}
function handleFiles(fl){
  const allowed=['html','htm','css','js','json','txt','svg','png','jpg','jpeg','gif','ico','webp'];
  let added=0;
  Array.from(fl).forEach(f=>{
    const ext=f.name.split('.').pop().toLowerCase();
    if(!allowed.includes(ext)){toast(`"${f.name}" not supported`,'warn');return;}
    if(f.size>10*1024*1024){toast(`"${f.name}" exceeds 10MB`,'warn');return;}
    nFiles.push(f);added++;
  });
  if(added)toast(`${added} file(s) added`);
  renderFileList();
}
function renderFileList(){
  const el=document.getElementById('file-list');if(!el)return;
  el.innerHTML=nFiles.map((f,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;background:#141c30;margin-bottom:4px">
      <span style="font-size:14px">${f.name.match(/\.(html|htm)$/i)?'📄':f.name.match(/\.css$/i)?'🎨':f.name.match(/\.js$/i)?'⚡':'📎'}</span>

      <button class="btn-icon" onclick="nFiles.splice(${i},1);renderFileList()">✕</button>

}

const DEMO_HTML=`<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>My Website</title>\n<style>\n* { margin:0;padding:0;box-sizing:border-box }\nbody { font-family:system-ui,sans-serif;background:#07090f;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e8edf5 }\n.box { text-align:center;padding:48px 32px }\nh1 { font-size:2.4rem;font-weight:700;margin-bottom:14px;background:linear-gradient(135deg,#00c97e,#4f8ef7);-webkit-background-clip:text;-webkit-text-fill-color:transparent }\np { color:#7b8db0;margin-bottom:24px;line-height:1.7 }\n.badge { background:#00c97e18;color:#00c97e;border:1px solid #00c97e30;padding:8px 20px;border-radius:100px;font-size:13px;font-weight:600 }\n</style>\n</head>\n<body>\n<div class="box">\n  <h1>🚀 Live on WebHost Pro</h1>\n  <p>Your site was deployed successfully!</p>\n  <div class="badge">✓ Deployed</div>\n</div>\n</body>\n</html>`;

function detectFW(h){if(!h)return'HTML';if(h.includes('__NEXT_DATA__'))return'Next.js';if(h.includes('Vue.createApp'))return'Vue';if(h.includes('ng-app'))return'Angular';if(h.includes('ReactDOM'))return'React';return'HTML';}
function sanitize(h){return(h||'').replace(/<script[^>]+src=["'][^"']*["'][^>]*>/gi,'').replace(/javascript:/gi,'data:');}

async function doDeploy(){
  const sub=(document.getElementById('n-sub')?.value||'').trim().toLowerCase();
  if(!sub||sub.length<3){toast('Enter a valid subdomain (min 3 chars)','warn');return;}
  if(S.sites.find(s=>s.sub===sub)){toast('Subdomain already taken','warn');return;}
  const editorVisible=document.getElementById('code-inp')?.style.display!=='none';
  let html=editorVisible?document.getElementById('code-inp')?.value||'':'';
  if(!html&&nFiles.length>0){
    const hf=nFiles.find(f=>f.name.match(/\.(html|htm)$/i));
    if(hf)html=await new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsText(hf);});
  }
  const finalHtml=sanitize(html||DEMO_HTML);
  const fw=detectFW(finalHtml);

  const logWrap=document.getElementById('deploy-log-wrap');
  const logEl=document.getElementById('deploy-logs');
  if(logWrap)logWrap.style.display='block';

  function addLog(msg,type='info'){
    if(!logEl)return;
    const c=type==='success'?'#00c97e':type==='error'?'#ef4444':'#7b8db0';
    logEl.innerHTML+=`<div style="color:${c}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    logEl.scrollTop=logEl.scrollHeight;
  }

  const btn=document.getElementById('deploy-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin">◌</span> Deploying...';}

  addLog('Initializing build environment...');await sleep(500);
  addLog(`Processing ${nFiles.length||1} file(s)...`);await sleep(600);
  addLog('Issuing SSL certificate...');await sleep(700);
  addLog('Deploying to CDN edge nodes...');await sleep(600);
  addLog(`✓ https://${sub}.webhost.pro is live!`,'success');

  const site={
    id:uid(),sub,html:finalHtml,
    files:nFiles.length?nFiles.map(f=>({name:f.name,size:f.size,ext:f.name.split('.').pop().toLowerCase(),lastMod:Date.now()})):[{name:'index.html',size:finalHtml.length,ext:'html',lastMod:Date.now()}],
    status:'live',ssl:true,framework:fw,deployedAt:Date.now(),
    visits:rnd(0,12),bandwidth:rnd(1,30),
    customDomains:[],envVars:[],
    settings:{https:true,gzip:true,spa:['React','Vue','Angular','Next.js'].includes(fw),password:''},
    history:[{id:uid(),deployedAt:Date.now(),trigger:'Manual Upload',html:finalHtml}],
    logs:[
      {time:new Date().toLocaleTimeString(),msg:'Build started',type:'info'},
      {time:new Date().toLocaleTimeString(),msg:'Framework: '+fw,type:'info'},
      {time:new Date().toLocaleTimeString(),msg:'SSL issued',type:'success'},
      {time:new Date().toLocaleTimeString(),msg:`✓ https://${sub}.webhost.pro live`,type:'success'},
    ],
    analytics:{days:Array.from({length:7},()=>rnd(0,40)),uniqueVisitors:rnd(5,80),bounceRate:rnd(25,70),avgTime:`${rnd(1,5)}m ${rnd(0,59)}s`,sources:[['Direct',rnd(30,55)],['Google',rnd(10,30)],['Social',rnd(5,18)],['Other',rnd(2,12)]]},
  };
  S.sites.unshift(site);nFiles=[];
  await saveSites();
  toast(`🎉 ${site.sub}.webhost.pro is live!`);
  openSite(site.id);
}

let connDom='';let connSiteId='';let connStep=1;

function openConnModal(domain,siteId){
  if(!S.sites.length){toast('Deploy a site first','warn');return;}
  connDom=domain;connSiteId=siteId||S.sites[0]?.id||'';connStep=1;
  showConnModal();
}

function showConnModal(){
  let m=document.getElementById('conn-modal');
  if(!m){m=document.createElement('div');m.id='conn-modal';m.className='modal-bg';document.body.appendChild(m);}
  m.style.display='flex';
  m.onclick=e=>{if(e.target===m)closeConnModal()};
  updateConnModal();
}
function closeConnModal(){const m=document.getElementById('conn-modal');if(m)m.style.display='none';}

function updateConnModal(){
  const m=document.getElementById('conn-modal');if(!m)return;
  const stepLabels=['Select Site','DNS Setup','Verify'];
  const stepsBar=stepLabels.map((l,i)=>`<div style="display:flex;align-items:center;gap:6px">${i>0?'<span style="color:#3d4f6e">›</span>':''}<div style="width:20px;height:20px;border-radius:50%;background:${connStep>i?'#00c97e':connStep===i+1?'#4f8ef7':'#1a2540'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${connStep>i?'#000':'#7b8db0'}">${connStep>i?'✓':i+1}</div><span style="font-size:11px;color:${connStep===i+1?'#e8edf5':'#7b8db0'}">${l}</span></div>`).join('');
  let body='';
  if(connStep===1){
    body=`
      <div style="font-size:13px;color:#7b8db0;margin-bottom:13px">Which site should <span style="font-family:monospace;color:#e8edf5">${connDom||'your domain'}</span> point to?</div>
      ${S.sites.map(s=>`
        <div onclick="connSiteId='${s.id}';updateConnModal()" style="display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:9px;border:1px solid ${connSiteId===s.id?'#00c97e55':'#1a2540'};background:${connSiteId===s.id?'#00c97e10':'#141c30'};cursor:pointer;margin-bottom:7px;transition:all .15s">
          <div style="width:7px;height:7px;border-radius:50%;background:${connSiteId===s.id?'#00c97e':'#3d4f6e'}"></div>
          <div style="flex:1"><div style="font-family:monospace;font-size:12px;font-weight:600;color:#e8edf5">${s.sub}.webhost.pro</div><div style="font-size:11px;color:#7b8db0;margin-top:2px">${s.framework||'HTML'}</div></div>
          ${sbadge(s.status)}
        </div>`).join('')}
      ${!connDom?`<div style="margin-bottom:13px;margin-top:13px"><div style="font-size:12px;color:#7b8db0;margin-bottom:7px">Domain to connect:</div><input class="input mono" id="conn-dom-inp" placeholder="example.com" value="${connDom}"></div>`:''}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn btn-ghost" onclick="closeConnModal()">Cancel</button>
        <button class="btn btn-green" onclick="connStep1Next()">Continue →</button>
      </div>`;
  } else if(connStep===2){
    const s=S.sites.find(x=>x.id===connSiteId);
    body=`
      <div style="font-size:13px;font-weight:600;margin-bottom:10px">Configure DNS Records</div>
      <div style="font-size:12px;color:#7b8db0;margin-bottom:14px">Log in to your domain registrar and add these records:</div>
      <div style="background:#060910;border-radius:8px;padding:13px;margin-bottom:15px;border:1px solid #1a2540">
        <div style="display:grid;grid-template-columns:70px 55px 1fr;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1a2540">
          ${['Type','Name','Value'].map(h=>`<span style="font-family:monospace;font-size:10px;color:#3d4f6e;font-weight:600;text-transform:uppercase">${h}</span>`).join('')}
        </div>
        ${[['CNAME','@',`${s?.sub||'yoursite'}.webhost.pro`],['CNAME','www',`${s?.sub||'yoursite'}.webhost.pro`]].map(([t,n,v],i)=>`
          <div style="display:grid;grid-template-columns:70px 55px 1fr;gap:8px;padding:5px 0;${i===0?'border-bottom:1px solid #1a254066':''}">
            <span class="badge badge-blue" style="width:fit-content;font-size:10px">${t}</span>
            <span style="font-family:monospace;font-size:12px;color:#f59e0b">${n}</span>
            <div style="display:flex;align-items:center;gap:6px"><span style="font-family:monospace;font-size:11px;color:#00c97e;word-break:break-all">${v}</span><button class="btn-icon" style="padding:3px 5px" onclick="copyText('${v}')">⎘</button></div>
          </div>`).join('')}
      </div>
      <div style="font-size:11px;color:#3d4f6e;margin-bottom:14px;line-height:1.6">🕐 DNS propagation takes <strong style="color:#7b8db0">1–48 hours</strong> globally.</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="connStep=1;updateConnModal()">Back</button>
        <button class="btn btn-green" onclick="connStep=3;updateConnModal()">I've Added Records →</button>
      </div>`;
  } else if(connStep===3){
    body=`
      <div style="text-align:center;padding:10px 0 18px">
        <div style="font-size:36px;margin-bottom:14px">🛡</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:8px">Verify Domain</div>
        <div style="font-family:monospace;font-size:14px;color:#00c97e;margin-bottom:14px">${connDom}</div>
        <div style="font-size:11px;color:#3d4f6e;margin-bottom:18px;padding:8px 14px;background:#141c30;border-radius:8px;line-height:1.6">DNS can take 1–48 hours. If it fails now, save and check later from the Connected tab.</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-ghost" onclick="saveDomainPending()">Save & Check Later</button>
          <button class="btn btn-green" id="verify-dom-btn" onclick="verifyDomain()">🔄 Verify Now</button>
        </div>
      </div>`;
  }

  m.innerHTML=`
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div><div style="font-size:14px;font-weight:600">Connect Domain</div><div style="font-family:monospace;font-size:12px;color:#00c97e;margin-top:2px">${connDom||'your-domain.com'}</div></div>
        <button class="btn-icon" onclick="closeConnModal()">✕</button>
      </div>
      <div style="background:#141c30;border-bottom:1px solid #1a2540;padding:11px 18px;display:flex;gap:8px;align-items:center">${stepsBar}</div>
      <div class="modal-body">${body}</div>
    </div>`;

  setTimeout(()=>{
    const inp=document.getElementById('conn-dom-inp');
    if(inp)inp.onkeydown=e=>{if(e.key==='Enter')connStep1Next()};
  },50);
}

function connStep1Next(){
  if(!connDom){
    const inp=document.getElementById('conn-dom-inp');
    const d=(inp?.value||'').trim().toLowerCase().replace(/^https?:\/\//,'');
    if(!/^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$/.test(d)){toast('Enter a valid domain (e.g. example.com)','warn');return;}
    connDom=d;
  }
  if(!connSiteId){toast('Select a site first','warn');return;}
  // Add domain to site as pending
  const s=S.sites.find(x=>x.id===connSiteId);
  if(s&&!(s.customDomains||[]).find(d=>d.domain===connDom)){
    s.customDomains=[...(s.customDomains||[]),{domain:connDom,status:'pending',addedAt:Date.now()}];
    saveSites();
  }
  connStep=2;updateConnModal();
}

function saveDomainPending(){closeConnModal();toast('Domain saved! Verify later from Domains tab.','info');renderPage();}

async function verifyDomain(){
  const btn=document.getElementById('verify-dom-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin">◌</span> Checking...';}
  await sleep(2200);
  if(Math.random()>0.65){
    const s=S.sites.find(x=>x.id===connSiteId);
    if(s)s.customDomains=(s.customDomains||[]).map(d=>d.domain===connDom?{...d,status:'active'}:d);
    await saveSites();
    toast(`✅ ${connDom} is now active!`);closeConnModal();renderPage();
  } else {
    if(btn){btn.disabled=false;btn.innerHTML='🔄 Try Again';}
    toast('DNS not propagated yet. Try again in a few hours.','warn');
  }
}

function scrollChat(){const w=document.getElementById('chat-wrap');if(w)w.scrollTop=w.scrollHeight;}

async function sendChat(){
  const inp=document.getElementById('chat-inp');
  const msg=(inp?.value||'').trim();
  if(!msg)return;
  if(inp)inp.value='';
  S.chatMsgs.push({role:'u',text:msg});
  // Add typing indicator
  const w=document.getElementById('chat-wrap');
  if(w){
    w.innerHTML+=`<div style="display:flex"><div class="chat-msg chat-ai" id="typing-msg"><span class="spin" style="font-size:12px">◌</span> Thinking...</div></div>`;
    scrollChat();
  }
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:700,
        system:'You are the WebHost Pro AI support assistant. Be concise and helpful. WebHost Pro is a free browser-based static hosting platform with Google-style login, cross-device cloud sync, subdomain deployment (.webhost.pro), custom domains, code editor, analytics, env vars, rollback, and domain search (.com registration). Respond in clear English, keep answers short.',
        messages:S.chatMsgs.filter(m=>m.role==='u').map(m=>({role:'user',content:m.text})),
      })
    });
    const data=await res.json();
    const reply=data?.content?.[0]?.text||'Sorry, please try again.';
    S.chatMsgs.push({role:'a',text:reply});
  }catch{S.chatMsgs.push({role:'a',text:'Connection error. Please try again.'});}
  const wrap=document.getElementById('chat-wrap');
  if(wrap){
    wrap.innerHTML=S.chatMsgs.map(m=>`
      <div style="display:flex;justify-content:${m.role==='u'?'flex-end':'flex-start'}">
        <div class="chat-msg ${m.role==='u'?'chat-user':'chat-ai'}">${esc(m.text).replace(/\n/g,'<br>')}</div>
      </div>`).join('');
    scrollChat();
  }
}

  el.innerHTML=filtered.length?filtered.map((it,i)=>`
    <div id="ci${i}" onclick="ci${i}fn()" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background .1s" onmouseover="this.style.background='#141c30'" onmouseout="this.style.background='transparent'">

}
