<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudDeploy — Your Hosting Platform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--s1:#0b0f1c;--s2:#0f1525;--s3:#141c30;--s4:#1a2540;--s5:#1e2d4a;
  --green:#00d97e;--gd:#00d97e18;--gb:#00d97e33;
  --blue:#4f8ef7;--purple:#a855f7;--amber:#f59e0b;--red:#ef4444;
  --t1:#eef2ff;--t2:#7b8db0;--t3:#3d4f6e;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;min-height:100vh}
button,input,textarea{font-family:inherit}button{cursor:pointer}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.fu{animation:fadeUp .22s ease}
.spin{animation:spin 1s linear infinite;display:inline-block}
.blink{animation:blink 2s infinite}

/* Layout */
#root{min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:230px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--s4);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;z-index:100}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--s4);background:var(--s1);position:sticky;top:0;z-index:50;flex-shrink:0;gap:12px}
.content{flex:1;overflow-y:auto;padding:22px}

/* Sidebar parts */
.sb-head{padding:15px 14px 12px;border-bottom:1px solid var(--s4)}
.sb-sec{font-size:10px;color:var(--t3);padding:10px 12px 5px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:9px;width:calc(100% - 12px);margin:1px 6px;padding:7px 10px;border-radius:8px;border:none;background:transparent;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;text-align:left}
.nav:hover{background:var(--s3);color:var(--t1)}
.nav.on{background:var(--gd);color:var(--green)}
.divider{height:1px;background:var(--s4);margin:6px 8px}

/* Inputs */
.inp{background:var(--s3);border:1px solid var(--s4);border-radius:8px;color:var(--t1);font-size:13px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--gd)}
.inp::placeholder{color:var(--t3)}
.inp.err{border-color:var(--red)!important;box-shadow:0 0 0 3px #ef444415!important}
.mono{font-family:'SF Mono',Monaco,Consolas,monospace}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-weight:500;font-size:13px;padding:8px 16px;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.btn:disabled{opacity:.35;cursor:not-allowed}
.bg{background:var(--green);color:#000}.bg:not(:disabled):hover{background:#00f08a;box-shadow:0 4px 16px var(--gb)}
.bb{background:transparent;border:1px solid var(--s4);color:var(--t2)}.bb:not(:disabled):hover{border-color:var(--s5);color:var(--t1);background:var(--s3)}
.br{background:#ef444415;border:1px solid #ef444430;color:var(--red)}.br:not(:disabled):hover{background:#ef444422}
.sm{font-size:12px;padding:5px 12px;border-radius:6px}
.xs{font-size:11px;padding:4px 9px;border-radius:5px}
.ic{background:transparent;border:none;color:var(--t2);padding:5px;border-radius:6px;display:inline-flex;align-items:center;transition:all .15s}.ic:hover{background:var(--s3);color:var(--t1)}

/* Cards */
.card{background:var(--s2);border:1px solid var(--s4);border-radius:12px;padding:16px}
.inner{background:var(--s3);border:1px solid var(--s4);border-radius:9px;padding:12px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500}
.live{background:var(--gd);color:var(--green);border:1px solid var(--gb)}
.off{background:#f59e0b18;color:var(--amber);border:1px solid #f59e0b30}
.gray{background:var(--s3);color:var(--t2);border:1px solid var(--s4)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--s4);overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.t{padding:9px 15px;background:transparent;border:none;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;position:relative;white-space:nowrap;transition:color .15s;flex-shrink:0}
.t:hover{color:var(--t1)}.t.on{color:var(--t1)}
.t.on::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--green);border-radius:2px 2px 0 0}

/* Toggle */
.tog{width:38px;height:20px;border-radius:100px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.tok{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px #0006}

/* Progress */
.pr{height:3px;background:var(--s4);border-radius:100px;overflow:hidden;margin:4px 0 2px}
.pf{height:100%;background:var(--green);border-radius:100px;transition:width .5s}

/* Dropzone */
.dz{border:1.5px dashed var(--s4);border-radius:10px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .18s}
.dz:hover,.dz.ov{border-color:var(--green);background:var(--gd)}

/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* Stats */
.stat{background:var(--s2);border:1px solid var(--s4);border-radius:10px;padding:13px}
.sv{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:5px 0 2px}
.sl{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.ss{font-size:11px;color:var(--t3)}

/* Toasts */
.tw{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.tk{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--s4);border-radius:10px;padding:11px 16px;font-size:13px;max-width:340px;box-shadow:0 8px 28px #0009;animation:toast-in .2s ease}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 20px;text-align:center;gap:12px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:8px 12px;text-align:left;color:var(--t2);font-weight:500;border-bottom:1px solid var(--s4);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #1a254044;color:var(--t1)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#141c3040}

/* Row */
.row{padding:12px 16px;border-bottom:1px solid var(--s4);transition:background .12s;cursor:pointer}
.row:last-child{border-bottom:none}.row:hover{background:#141c3055}

/* Code editor */
.ce{background:#050810;border:1px solid var(--s4);border-radius:8px;padding:13px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:12px;color:#9cca9c;width:100%;resize:vertical;outline:none;line-height:1.8;min-height:260px}
.ce:focus{border-color:#00d97e44}

/* Site frame */
.browser{border:1px solid var(--s4);border-radius:12px;overflow:hidden}
.browser-bar{background:#050810;padding:9px 14px;display:flex;align-items:center;gap:9px}
.traffic{display:flex;gap:5px}
.tl{width:10px;height:10px;border-radius:50%}
.url-bar{flex:1;background:var(--s2);border-radius:6px;padding:4px 12px;font-size:11px;color:var(--t2);font-family:monospace}

/* Chat */
.cu{background:var(--gd);border:1px solid var(--gb);color:var(--t1);border-radius:12px 12px 2px 12px;padding:9px 13px;max-width:82%;line-height:1.6;margin-bottom:8px;font-size:13px;align-self:flex-end}
.ca{background:var(--s3);border:1px solid var(--s4);color:var(--t2);border-radius:12px 12px 12px 2px;padding:9px 13px;max-width:82%;line-height:1.6;margin-bottom:8px;font-size:13px;align-self:flex-start}

/* Shimmer */
.sk{position:relative;overflow:hidden;background:var(--s3);border-radius:8px}
.sk::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff06,transparent);animation:shimmer 1.5s infinite}

/* Google auth */
.ga-ov{position:fixed;inset:0;background:#00000077;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .18s ease}
.ga-box{background:#fff;border-radius:8px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.22);overflow:hidden;animation:fadeUp .2s ease}
.ga-inp{width:100%;padding:12px 14px;border:1px solid #dadce0;border-radius:4px;font-size:14px;outline:none;color:#3c4043;font-family:inherit;transition:border-color .15s}
.ga-inp:focus{border-color:#1a73e8;box-shadow:0 0 0 2px #1a73e815}
.ga-inp.err{border-color:#d93025!important}
.ga-next{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s}
.ga-next:hover{background:#1557b0}
.ga-next:disabled{opacity:.45;cursor:not-allowed}
.ga-link{background:none;border:none;color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.ga-link:hover{text-decoration:underline}
.ga-row{display:flex;align-items:center;gap:12px;padding:11px 32px;cursor:pointer;transition:background .12s;border-bottom:1px solid #f1f3f4}
.ga-row:last-child{border-bottom:none}.ga-row:hover{background:#f8f9fa}
.ga-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}

/* Mobile */
.mob-ov{display:none;position:fixed;inset:0;background:#0008;z-index:90}
@media(max-width:768px){
  .sidebar{position:fixed;left:-230px;top:0;height:100vh;z-index:100;transition:left .25s ease}
  .sidebar.open{left:0;box-shadow:20px 0 50px #000b}
  .mob-ov.show{display:block}
  .mob-btn{display:inline-flex!important}
  .content{padding:14px!important}
  .g2,.g3{grid-template-columns:1fr!important}
}
@media(min-width:769px){.mob-btn{display:none!important}}

/* Preview modes */
.pmode{padding:4px 11px;border-radius:5px;border:none;cursor:pointer;font-size:11px;transition:all .15s}

/* Sync indicator */
.sync{background:var(--s2);border-bottom:1px solid var(--s4);padding:5px 22px;font-size:11px;color:var(--t2);display:none;align-items:center;gap:7px}
.sync.show{display:flex}

/* Deploy step list */
.ds{display:flex;align-items:flex-start;gap:12px;padding:9px 0}
.di{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.dl{width:1px;height:20px;margin:3px 0 0 12px;background:var(--s4)}
</style>
</head>
<body>
<div id="root"></div>
<div class="tw" id="tw"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const S={
  user:null,sites:[],
  page:'dash',siteId:null,siteTab:'overview',
  sideOpen:false,prevMode:0,
  editCode:'',
  chatMsgs:[{r:'a',t:'Hi! I\'m your CloudDeploy assistant. How can I help you?'}],
  deployFiles:[],
  authStep:'',authEmail:''
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// HELPERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtSz=b=>b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(2)+'MB';
const fmtD=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const inits=n=>n?n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2):'?';
const ekey=e=>btoa(unescape(encodeURIComponent(e.toLowerCase().trim()))).replace(/[^a-zA-Z0-9]/g,'');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STORAGE (cross-device cloud)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function cGet(k){try{const r=await window.storage.get(k,true);return r?.value?JSON.parse(r.value):null}catch{return null}}
async function cSet(k,v){
  try{await window.storage.set(k,JSON.stringify(v),true);return true}
  catch(e){console.error('Storage write failed:',k,e);toast('⚠ Cloud sync failed — data may not be saved','e');return false}
}
async function cDel(k){try{await window.storage.delete(k,true)}catch{}}

// Local session
const SK='cd_sess_v3',AK='cd_accs_v3';
function lGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function lSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function lDel(k){try{localStorage.removeItem(k)}catch{}}

function getSession(){
  try{
    const s=lGet(SK);if(!s)return null;
    if(s.exp&&Date.now()>s.exp){clearSession();return null;}
    return s;
  }catch{return null}
}
function setSession(u){lSet(SK,{...u,exp:Date.now()+(30*24*60*60*1000)})}
function clearSession(){lDel(SK)}
function getSaved(){return lGet(AK)||[]}
function saveAcc(u){const a=getSaved().filter(x=>x.email!==u.email);lSet(AK,[u,...a].slice(0,5))}
function removeAcc(e){lSet(AK,getSaved().filter(x=>x.email!==e))}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toast(msg,type='s'){
  const c={s:'#00d97e',e:'#ef4444',w:'#f59e0b',i:'#4f8ef7'}[type]||'#00d97e';
  const ic={s:'✓',e:'✕',w:'⚠',i:'ℹ'}[type]||'✓';
  const d=document.createElement('div');
  d.className='tk';d.style.borderLeft=`3px solid ${c}`;
  d.innerHTML=`<span style="color:${c};font-weight:700;font-size:15px">${ic}</span><span style="flex:1;color:var(--t1)">${msg}</span><span onclick="this.parentNode.remove()" style="color:var(--t3);cursor:pointer;font-size:16px;margin-left:4px">×</span>`;
  $('tw').appendChild(d);setTimeout(()=>d.remove&&d.remove(),4200);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CLOUD DATA HELPERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function loadUserSites(){
  if(!S.user)return;
  const meta=await cGet('cd:sites:'+ekey(S.user.email));
  if(!meta){S.sites=[];return;}
  // Rehydrate HTML from individual keys
  for(const s of meta){
    s.html=await cGet('cd:html:'+s.id)||'';
    if(!s.analytics)s.analytics={days:[0,0,0,0,0,0,0],uv:0,br:0,at:'0m 0s',src:[['Direct',0],['Google',0],['Social',0],['Other',0]]};
  }
  S.sites=meta;
}
async function saveSites(){
  if(!S.user)return;
  showSync(true);
  // Save metadata only (no html) to main key — prevents 5MB overflow
  const meta=S.sites.map(({html,...rest})=>rest);
  const ok=await cSet('cd:sites:'+ekey(S.user.email),meta);
  // Save each site's HTML separately under its own key
  for(const s of S.sites){
    if(s.html)await cSet('cd:html:'+s.id,s.html);
  }
  if(!ok)console.warn('saveSites: metadata save failed');
  setTimeout(()=>showSync(false),1000);
}

function showSync(v){
  const el=$('syncbar');if(el)el.className='sync'+(v?' show':'');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// GOOGLE-STYLE AUTH MODAL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showAuth(){
  const saved=getSaved();
  S.authStep=saved.length?'accounts':'email';
  S.authEmail='';
  renderAuth();
}

function renderAuth(){
  let m=$('auth-modal');
  if(!m){
    m=document.createElement('div');
    m.id='auth-modal';m.className='ga-ov';
    m.onclick=e=>{if(e.target===m)m.style.display='none'};
    document.body.appendChild(m);
  }
  m.style.display='flex';
  const saved=getSaved();

  // Google logo SVG
  const glogo=`<svg width="22" height="22" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>`;

  let body='';

  if(S.authStep==='accounts'){
    body=`
    <div style="padding:26px 32px 0;text-align:center">
      ${glogo.replace('width="22" height="22"','width="66" height="22" style="margin-bottom:14px;display:block;margin-left:auto;margin-right:auto"')}
      <div style="font-size:20px;font-weight:400;color:#202124;margin-bottom:4px">Choose an account</div>
      <div style="font-size:13px;color:#5f6368;margin-bottom:18px">to continue to CloudDeploy</div>
    </div>
    ${saved.map((a,idx)=>`
      <div class="ga-row" data-idx="${idx}" onclick="loginSavedByIndex(this.dataset.idx)">
        <div class="ga-av" style="background:${a.av||'#4f8ef7'}">${inits(a.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:500;color:#202124;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</div>

async function emailNext(){
  const em=($('ga-email')?.value||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){
    const e=$('ga-err');if(e){e.textContent='Enter a valid email address';e.style.display='block';}
    $('ga-email')?.classList.add('err');return;
  }
  S.authEmail=em;
  S.authStep='loading';renderAuth();
  const existing=await cGet('cd:user:'+ekey(em));
  if(existing){
    await doLogin({email:em,name:existing.name,av:existing.av,joined:existing.joined});
  } else {
    S.authStep='name';renderAuth();
  }
}

async function nameNext(){
  const nm=($('ga-name')?.value||'').trim();
  if(!nm)return;
  S.authStep='loading';renderAuth();
  const colors=['#00d97e','#4f8ef7','#a855f7','#f59e0b','#ef4444','#06b6d4'];
  const av=colors[S.authEmail.charCodeAt(0)%colors.length];
  const profile={email:S.authEmail,name:nm,av,joined:Date.now()};
  await cSet('cd:user:'+ekey(S.authEmail),profile);
  await doLogin(profile);
}

async function loginSaved(email){
  const saved=getSaved().find(a=>a.email===email);
  if(!saved)return;
  S.authStep='loading';renderAuth();
  try{
    const existing=await cGet('cd:user:'+ekey(email));
    if(existing){
      await doLogin({email,name:existing.name,av:existing.av,joined:existing.joined});
    } else {
      removeAcc(email);S.authStep='email';renderAuth();
      toast('Account not found. Please sign in again.','w');
    }
  }catch(e){
    S.authStep='email';renderAuth();
    toast('Login failed. Please try again.','e');
  }
}

// Safe version — uses index instead of email in onclick to prevent XSS
function loginSavedByIndex(idx){
  const saved=getSaved();
  const acc=saved[parseInt(idx)];
  if(acc?.email)loginSaved(acc.email);
}

async function doLogin(user){
  S.user=user;setSession(user);saveAcc(user);
  const m=$('auth-modal');if(m)m.style.display='none';
  await loadUserSites();
  renderApp();
  toast(`Welcome back, ${user.name.split(' ')[0]}! 👋`);
}

function detectFW(h){
  if(!h)return'HTML';
  if(h.includes('__NEXT_DATA__')||h.includes('/_next/'))return'Next.js';
  if(h.includes('Vue.createApp')||h.includes('createApp('))return'Vue';
  if(h.includes('ng-app=')||h.includes('NgModule')||h.includes('[ngModule]'))return'Angular';
  if(h.includes('ReactDOM.render')||h.includes('ReactDOM.createRoot')||h.includes('react-dom'))return'React';
  if(h.includes('__svelte')||h.includes('svelte/'))return'Svelte';
  return'HTML';
}
function sanitize(h){
  if(!h)return'';
  return h
    // Remove complete script blocks (inline + external)
    .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script\s*>/gi,'')
    // Remove meta refresh/redirect
    .replace(/<meta[^>]+http-equiv[^>]*>/gi,'')
    // Remove object, embed, applet tags
    .replace(/<(object|embed|applet|base)\b[^<]*(?:(?!<\/\1>)<[^<]*)*(<\/\1\s*>)?/gi,'')
    // Remove inline event handlers (onclick, onerror, onload etc)
    .replace(/\son\w+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]*)/gi,'')
    // Replace javascript: with data:
    .replace(/javascript\s*:/gi,'data:')
    // Remove data: URIs in src/href attributes (can execute in some browsers)
    .replace(/(src|href)\s*=\s*"data:[^"]+"/gi,'$1=""')
    .replace(/(src|href)\s*=\s*'data:[^']+'/gi,"$1=''");
}

const DEMO=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Site</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#07090f;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#eef2ff}.box{text-align:center;padding:48px 32px;max-width:480px}h1{font-size:2.4rem;font-weight:700;margin-bottom:14px;background:linear-gradient(135deg,#00d97e,#4f8ef7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}p{color:#7b8db0;line-height:1.7;margin-bottom:24px}.badge{display:inline-flex;align-items:center;gap:8px;background:#00d97e18;color:#00d97e;border:1px solid #00d97e33;padding:8px 20px;border-radius:100px;font-size:13px;font-weight:600}</style></head><body><div class="box"><h1>🚀 Deployed!</h1><p>Your site is live on CloudDeploy. Replace this with your own content.</p><div class="badge">✓ Live</div></div></body></html>`;

async function doDeploy(){
  // Guard: prevent double-deploy on rapid clicks
  if(S._deploying)return;
  S._deploying=true;

  const sub=($('n-sub')?.value||'').trim().toLowerCase();
  if(!sub||sub.length<3){toast('Enter a valid site name (min 3 chars)','w');S._deploying=false;return;}
  if(S.sites.find(s=>s.sub===sub)){toast('This name is already used. Choose another.','w');S._deploying=false;return;}

  const isEd=$('html-ed')?.style.display!=='none';
  const edHTML=isEd?($('html-ed')?.value||''):'';
  if(!edHTML&&!nf.length){toast('Add files or write HTML first','w');S._deploying=false;return;}

  const lw=$('log-wrap');const le=$('dlog');
  if(lw)lw.style.display='block';
  const log=(msg,type='i')=>{
    if(!le)return;
    const c=type==='s'?'#00d97e':type==='e'?'#ef4444':'#7b8db0';
    le.innerHTML+=`<div style="color:${c}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    le.scrollTop=le.scrollHeight;
  };

  const btn=$('dep-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin">◌</span>  Deploying...';}

  try{
    log('Starting deployment...');await sleep(400);
    log('Validating files...');await sleep(400);

    // Read HTML
    let html=edHTML;
    if(!html&&nf.length){
      const hf=nf.find(f=>f.name.match(/\.(html|htm)$/i));
      if(hf){
        log(`Reading ${hf.name}...`);
        html=await new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsText(hf);});
      }
    }
    html=sanitize(html||DEMO);
    const fw=detectFW(html);
    log(`Framework detected: ${fw}`);await sleep(300);
    log('Saving to cloud storage...');await sleep(500);

    // Build file list metadata
    const files=nf.length?nf.map(f=>({name:f.name,size:f.size,ext:f.name.split('.').pop().toLowerCase(),mod:Date.now()})):[{name:'index.html',size:html.length,ext:'html',mod:Date.now()}];

    const site={
      id:uid(),sub,html,files,framework:fw,
      status:'live',ssl:true,
      createdAt:Date.now(),updatedAt:Date.now(),
      visits:0,  // Real: starts at zero, incremented on each preview open
      customDomain:null,
      envVars:[],
      settings:{https:true,gzip:true,spa:['React','Vue','Angular','Next.js','Svelte'].includes(fw),password:''},
      history:[{id:uid(),createdAt:Date.now(),label:'Initial Deploy',html}],
      logs:[
        {t:new Date().toLocaleTimeString(),m:'Deployment started',type:'i'},
        {t:new Date().toLocaleTimeString(),m:`Framework: ${fw}`,type:'i'},
        {t:new Date().toLocaleTimeString(),m:'Files saved to cloud',type:'s'},
        {t:new Date().toLocaleTimeString(),m:`✓ ${sub}.clouddeploy.app is live!`,type:'s'},
      ],
      // Real analytics — all zeros at start, updated on real events
      analytics:{days:[0,0,0,0,0,0,0],uv:0,br:0,at:'0m 0s',src:[['Direct',0],['Google',0],['Social',0],['Other',0]]},
    };

    S.sites.unshift(site);
    const saved=await saveSites();
    nf=[];

    log(`✓ https://${sub}.clouddeploy.app is live!`,'s');
    toast(`🎉 ${sub}.clouddeploy.app deployed!`);
    await sleep(600);
    openSite(site.id);
  }catch(e){
    log('❌ Deploy failed: '+e.message,'e');
    toast('Deploy failed: '+e.message,'e');
  }finally{
    S._deploying=false;
    if(btn){btn.disabled=false;btn.innerHTML='🚀 &nbsp; Deploy Website';}
  }
}

function stab(t){
  S.siteTab=t;
  if(t==='editor')S.editCode=S.sites.find(x=>x.id===S.siteId)?.html||'';
  // Real visit tracking — increment every time preview is opened
  if(t==='preview'){

    if(s){
      s.visits=(s.visits||0)+1;
      if(!s.analytics)s.analytics={days:[0,0,0,0,0,0,0],uv:0,br:0,at:'0m 0s',src:[['Direct',0],['Google',0],['Social',0],['Other',0]]};
      s.analytics.days[6]=(s.analytics.days[6]||0)+1;
      s.analytics.uv=(s.analytics.uv||0)+1;
      s.analytics.src[0][1]=(s.analytics.src[0][1]||0)+1;
      saveSites(); // Save real visit data
    }
  }
  const el=$('stb');if(!el)return;
  el.className='fu';void el.offsetWidth;
  const s=S.sites.find(x=>x.id===S.siteId);
  if(s)el.innerHTML=sitePg(s);

  if(S.siteTab==='domain')return sDomain(s);
  if(S.siteTab==='env')return sEnv(s);
  if(S.siteTab==='settings')return sSettings(s);
  if(S.siteTab==='logs')return sLogs(s);
  if(S.siteTab==='history')return sHistory(s);
  return '';
}

function uploadMore(sid){

  inp.onchange=async e=>{

async function saveCode(sid){
  const s=S.sites.find(x=>x.id===sid);if(!s)return;
  const btn=$('save-btn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin">◌</span>';}
  const code=$('code-ta')?.value||S.editCode||'';
  // Skip if content unchanged
  if(code===s.html){
    if(btn){btn.disabled=false;btn.innerHTML='💾 Save';}
    toast('No changes to save','i');return;
  }
  s.html=sanitize(code);
  s.updatedAt=Date.now();
  s.files=(s.files||[]).map(f=>(f.ext==='html'||f.ext==='htm')?{...f,mod:Date.now(),size:code.length}:f);
  // Cap history at 10 versions to prevent storage overflow
  const MAX_HISTORY=10;
  s.history=[{id:uid(),createdAt:Date.now(),label:'Manual Edit',html:s.html},...(s.history||[])].slice(0,MAX_HISTORY);
  await saveSites();
  if(btn){btn.disabled=false;btn.innerHTML='💾 Save';}
  toast('Code saved! Check Preview tab.');
}

async function saveDomain(sid){
  const s=S.sites.find(x=>x.id===sid);if(!s)return;
  const raw=($('dom-inp')?.value||'').trim().toLowerCase()
    .replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  // Validate domain format
  if(raw && !/^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$/.test(raw)){
    toast('Enter a valid domain like mysite.com','w');return;
  }
  s.customDomain=raw||null;
  await saveSites();
  toast(raw?`Custom domain saved: ${raw}`:'Custom domain removed');
  stab('domain');
}
async function removeDomain(sid){
  const s=S.sites.find(x=>x.id===sid);if(!s)return;

async function addEnv(sid){
  const k=$('ek')?.value.trim();const v=$('ev')?.value.trim();if(!k)return;
  if(!/^[A-Z_][A-Z0-9_]*$/i.test(k)){toast('Key should be like API_KEY (letters, numbers, underscores)','w');return;}
  const s=S.sites.find(x=>x.id===sid);if(!s)return;
  if((s.envVars||[]).find(e=>e.k===k)){toast('Variable already exists','w');return;}
  s.envVars=[...(s.envVars||[]),{k,v:v||''}];
  await saveSites();toast('Variable added!');stab('env');
}
async function delEnv(sid,idx){

async function rollback(sid,idx){
  if(!confirm('Restore this version? Your current code will be replaced. This cannot be undone.'))return;
  const s=S.sites.find(x=>x.id===sid);if(!s)return;
  const h=s.history[idx];
  if(!h?.html){toast('No HTML found in this version','e');return;}
  s.html=h.html;
  s.updatedAt=Date.now();
  s.status='live';
  // Add rollback as new history entry
  const MAX_HISTORY=10;
  s.history=[{id:uid(),createdAt:Date.now(),label:`Restored from ${fmtD(h.createdAt)}`},...s.history].slice(0,MAX_HISTORY);
  await saveSites();
  toast('Restored to previous version!');
  stab('overview');
}

function pgSupport(){return`
  <div style="max-width:580px">
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--s4);display:flex;align-items:center;gap:10px">

        <div><div style="font-size:13px;font-weight:600">AI Assistant</div><div style="font-size:11px;color:var(--t2)">Powered by Claude</div></div>
        <span class="badge live" style="margin-left:auto">Online</span>
      </div>
      <div id="cw" style="display:flex;flex-direction:column;min-height:320px;max-height:420px;overflow-y:auto;padding:13px 15px 6px">
        ${S.chatMsgs.map(m=>`<div style="display:flex;justify-content:${m.r==='u'?'flex-end':'flex-start'}"><div class="${m.r==='u'?'cu':'ca'}">${esc(m.t).replace(/\n/g,'<br>')}</div></div>`).join('')}
      </div>
      <div style="padding:10px 14px;border-top:1px solid var(--s4);display:flex;gap:8px">
        <input class="inp" id="ci" placeholder="Ask anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}">

      </div>

      ${['How do I deploy?','How to update my site?','What is SPA mode?','How to add env vars?','How to restore a version?'].map(q=>`<button class="btn bb sm" style="font-size:11px" onclick="$('ci').value='${q}';sendMsg()">${q}</button>`).join('')}
    </div>
  </div>`;}

function schat(){const w=$('cw');if(w)w.scrollTop=w.scrollHeight;}
async function sendMsg(){
  const inp=$('ci');const msg=(inp?.value||'').trim();if(!msg)return;
  if(inp)inp.value='';
  S.chatMsgs.push({r:'u',t:msg});
  const w=$('cw');
  if(w){w.innerHTML+=`<div style="display:flex"><div class="ca" id="typing"><span class="spin" style="font-size:12px">◌</span> Thinking...</div></div>`;schat();}
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,
        system:'You are the CloudDeploy AI assistant. CloudDeploy is a fully self-built browser-based website hosting platform — no external hosting services like Netlify or Vercel are used. Sites are stored in cloud storage and previewed via iframe. Users can deploy HTML/CSS/JS, manage sites, edit code, rollback versions, add custom domains, set env vars. Be helpful, concise, friendly.',
        messages:S.chatMsgs.filter(m=>m.r==='u').map(m=>({role:'user',content:m.t}))
      })});
    const d=await r.json();
    S.chatMsgs.push({r:'a',t:d?.content?.[0]?.text||'Sorry, please try again.'});
  }catch{S.chatMsgs.push({r:'a',t:'Connection error. Please try again.'});}
  if(w){
    w.innerHTML=S.chatMsgs.map(m=>`<div style="display:flex;justify-content:${m.r==='u'?'flex-end':'flex-start'}"><div class="${m.r==='u'?'cu':'ca'}">${esc(m.t).replace(/\n/g,'<br>')}</div></div>`).join('');
    schat();
  }
}

// COMMAND PALETTE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openCmd(){
  let el=$('cmd');
  if(!el){
    el=document.createElement('div');el.id='cmd';
    el.style.cssText='display:none;position:fixed;inset:0;background:#00000088;backdrop-filter:blur(3px);z-index:300;align-items:flex-start;justify-content:center;padding-top:100px';
    el.innerHTML=`<div style="background:var(--s2);border:1px solid var(--s4);border-radius:14px;width:calc(100% - 40px);max-width:500px;overflow:hidden;box-shadow:0 24px 80px #000b;animation:fadeUp .2s ease" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--s4)">
        <span>🔍</span>
        <input id="cq" style="flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:14px;font-family:inherit" placeholder="Search..." oninput="updCmd()" onkeydown="if(event.key==='Escape')closeCmd()">
        <kbd style="background:var(--s3);border:1px solid var(--s4);border-radius:4px;padding:2px 7px;font-size:11px;color:var(--t2)">ESC</kbd>
      </div>
      <div id="clist" style="max-height:280px;overflow-y:auto;padding:7px"></div>
      <div style="padding:8px 15px;border-top:1px solid var(--s4);font-size:11px;color:var(--t3)">↵ Select · ESC Close</div>
    </div>`;
    el.onclick=e=>{if(e.target===el)closeCmd();};
    document.body.appendChild(el);
  }
  el.style.display='flex';const q=$('cq');if(q){q.value='';q.focus();}updCmd();
}
function closeCmd(){const el=$('cmd');if(el)el.style.display='none';}

function updCmd(){
  const q=($('cq')?.value||'').toLowerCase();
  const items=[
    {l:'Dashboard',a:()=>go('dash')},
    {l:'My Sites',a:()=>go('sites')},
    {l:'New Deployment',a:()=>go('new')},
    {l:'AI Support',a:()=>go('support')},
    {l:'Guide',a:()=>go('docs')},
    {l:'Sign Out',a:logout},
    ...S.sites.map(s=>({l:`Open ${s.sub}.clouddeploy.app`,a:()=>openSite(s.id)})),
  ];
  const f=q?items.filter(i=>i.l.toLowerCase().includes(q)):items;
  const el=$('clist');if(!el)return;
  el.innerHTML=f.length?f.map((it,i)=>`<div onclick="_c${i}()" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--t1);transition:background .1s" onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='transparent'"><span style="flex:1">${esc(it.l)}</span><span style="color:var(--t3)">›</span></div>`).join(''):`<div style="padding:18px;text-align:center;font-size:13px;color:var(--t2)">No results</div>`;
  f.forEach((it,i)=>{window[`_c${i}`]=()=>{it.a();closeCmd();};});
}

function copy(t){navigator.clipboard?.writeText(t).then(()=>toast('Copied!')).catch(()=>toast('Copy failed','w'));}

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();if(S.user)openCmd();}
  if(e.key==='Escape')closeCmd();
});
