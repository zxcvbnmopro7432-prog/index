<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Website</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:white;
      color:black;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:#f5f5f5;
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 20px rgba(0,0,0,0.1);
    }

    h1{
      color:#00aa66;
      margin-bottom:10px;
    }

    p{
      color:#555;
    }

    button{
      margin-top:20px;
      padding:12px 25px;
      border:none;
      border-radius:10px;
      background:#00cc77;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Website Working ✅</h1>
    <p>Your Vercel deployment is successful.</p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </div>

  <script>
    function showMessage(){
      alert("Your Website is Live 🚀");
    }
  </script>

</body>
</html>
